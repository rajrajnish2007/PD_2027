<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PD_2027</title>
    <style>.success-popup {
    position: fixed;
    top: 25px;
    right: 25px;

    background-color: #16a34a;
    color: white;

    padding: 16px 25px;
    border-radius: 10px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.2);

    z-index: 9999;
    animation: slideIn 0.4s ease;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(100px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}</style>
</head>
<body>
    {% if messages %}
    {% for message in messages %}
        <div class="success-popup">
            {{ message }}
        </div>
    {% endfor %}
    {% endif %}
    <a href="{% url 'register_institutional'%}">Register Now</a>
    <script>
    setTimeout(() => {
        document.querySelectorAll('.success-popup').forEach(popup => {
            popup.remove();
        });
    }, 4000);
    </script>
</body>
</html>
